name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend
        run: npm run build:backend

      - name: Deploy frontend
        run: |
          mkdir -p /var/www/mc-server-manager
          rsync -av --delete dist/ /var/www/mc-server-manager/

      - name: Deploy backend
        run: |
          mkdir -p /opt/mc-server-manager
          rsync -av backend/dist/ /opt/mc-server-manager/
          rsync -av node_modules/ /opt/mc-server-manager/node_modules/
          rsync -av package.json package-lock.json /opt/mc-server-manager/
