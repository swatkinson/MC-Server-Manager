name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and backend
        run: npm run build:prod

      - name: Deploy to server
        run: |
          mkdir -p ~/mc-server-manager
          rsync -av --delete dist/ ~/mc-server-manager/dist/
          rsync -av --delete package.json package-lock.json ~/mc-server-manager/

      - name: Install production dependencies
        run: |
          cd ~/mc-server-manager
          npm ci --omit=dev

      - name: Restart service
        run: |
          sudo systemctl restart mc-server-manager

      - name: Verify service is running
        run: |
          sleep 2
          systemctl is-active --quiet mc-server-manager && echo "Service running" || exit 1
